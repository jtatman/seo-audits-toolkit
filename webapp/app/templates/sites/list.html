{% extends "base.html" %}
{% block title %}Sites - OSAT{% endblock %}
{% block content %}
<h1>Your sites</h1>
<p><a href="{{ url_for('sites.create_site') }}">+ Add a site</a></p>

{% if sites %}
    {% for site in sites %}
        <div class="card">
            <a href="{{ url_for('sites.detail', site_id=site.id) }}">{{ site.name }}</a>
            <div class="muted">{{ site.url }}</div>
        </div>
    {% endfor %}
{% else %}
    <p class="muted">No sites yet. Add your first one to start running audits.</p>
{% endif %}
{% endblock %}
