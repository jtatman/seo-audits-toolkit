{% extends "base.html" %}
{% block title %}Add a site - OSAT{% endblock %}
{% block content %}
<h1>Add a site</h1>
<form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required autofocus placeholder="My website">

    <label for="url">URL</label>
    <input type="url" id="url" name="url" required placeholder="https://example.com">

    <label>
        <input type="checkbox" name="only_domain" style="width: auto; display: inline-block; margin-top: 0;">
        Restrict audits to this domain only
    </label>

    <button type="submit">Add site</button>
</form>
{% endblock %}
