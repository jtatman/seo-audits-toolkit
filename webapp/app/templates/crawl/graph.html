{% extends "base.html" %}
{% block title %}Link graph - Site crawl - {{ site.name }} - OSAT{% endblock %}
{% block content %}
<p><a href="{{ url_for('crawl.detail', site_id=site.id, scan_id=scan.id) }}">&larr; Site crawl</a></p>
<h1>Link graph</h1>

{% if scan.bokeh_item %}
    <div id="site-crawl-graph"></div>
    <script src="{{ url_for('static', filename='js/bokeh/bokeh.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bokeh/bokeh-tables.min.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            Bokeh.embed.embed_item({{ scan.bokeh_item | tojson }});
        });
    </script>
{% else %}
    <p class="muted">Not ready yet - refresh once the download phase finishes.</p>
{% endif %}
{% endblock %}
